cat << 'EOF' > ~/.config/hypr/hyprland.conf
# Hyprland Starter Configuration

# Set the Windows/Super key as the main modifier
$mainMod = SUPER

# Core Keybinds
bind = $mainMod, Q, exec, konsole
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 

# Monitor Layout (Default: Auto resolution and scaling)
monitor=,preferred,auto,1
EOF
